# ทดสอบทั้งระบบทุกครั้งที่ push แล้ว deploy หน้าเว็บขึ้น GitHub Pages เมื่อผ่านเท่านั้น
name: test-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: ทดสอบฐานข้อมูล
        run: bash tests/db/run.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: ติดตั้ง
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium && sudo apt-get install -y poppler-utils
      - name: ทดสอบหน่วย
        working-directory: web
        run: npm run test:unit
      - name: ทดสอบหน้าเว็บ (โหมดสาธิต)
        working-directory: web
        run: npm run test:e2e
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
